# Раздел «Управление коммуникацией»: Inbox сообщений из личного Telegram, разбор и тред.
#
# Файл едет вместе с пакетом и применяется на любой машине, поэтому путей конкретного
# компьютера здесь нет. Обязательный workspaceRoot задаётся слоем профиля — точечной
# правкой конфигурации по идентификатору `communication-inbox`:
#
#   - id: communication-inbox
#     config:
#       workspaceRoot: '/путь/к/воркспейсу'
#
# Пока он не задан, плагин поднимается и говорит в панели, чего ему не хватает.
#
# Секретов здесь нет и быть не должно: файл лежит в репозитории. Ключ приложения Telegram
# и файл сессии читаются из окружения (TG_API_ID, TG_API_HASH, TG_SESSION) — их держит
# у себя владелец машины.
- insert:
    - id: communication-inbox
      name: dsh-communication-plugin
      config:
        # База заявок относительно workspaceRoot. Один файл, без сервера СУБД.
        dbPath: 'communication/inbox.db'
        # Чаты, за которыми следим: username, ссылка или идентификатор.
        # Пустой список — коллектор не стартует, панель остаётся пустой и говорит об этом.
        watchedChats: []
        # Бюджет задержки в секундах. Заявка, собранная позже него, помечается пришедшей
        # с задержкой: догонять простой машины раздел не обязан, скрывать его — обязан не.
        delayBudgetSec: 300
