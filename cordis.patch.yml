# Раздел «Управление коммуникацией»: Inbox сообщений из личного Telegram, разбор и тред.
#
# Файл едет вместе с пакетом и применяется на любой машине, поэтому путей конкретного
# компьютера здесь нет. Обязательный workspaceRoot задаётся слоем профиля — точечной
# правкой конфигурации по идентификатору `communication-inbox`:
#
#   - id: communication-inbox
#     config:
#       workspaceRoot: '/путь/к/воркспейсу'
#
# Раздел только читает базу заявок. Сбор идёт отдельным процессом (`node bin/collect.mjs`
# в каталоге плагина): клиент Telegram тянет нативный модуль, а несовместимый бинарь
# роняет весь харнесс целиком, а не свой раздел.
#
# Реестр чатов, ключ Telegram и бюджет задержки живут в `.env` коллектора — здесь их нет
# намеренно: две копии одной настройки разъезжаются. Путь к базе обязан совпадать
# с INBOX_DB коллектора, иначе раздел покажет пустой Inbox при работающем сборе.
- insert:
    - id: communication-inbox
      name: dsh-communication-plugin
      config:
        # База заявок относительно workspaceRoot. Один файл, без сервера СУБД.
        dbPath: 'communication/inbox.db'
